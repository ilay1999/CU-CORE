## Settings file was created by plugin Cursor Aim v1.1.0
## Plugin GUID: com.example.casualties.cursoraim

[AmmoHud]

## Показывать патроны и магазины над панелью управления оружием.
# Setting type: Boolean
# Default value: true
ShowAmmoHud = true

## Сдвиг левой панели по X (в единицах интерфейса), положительное = вправо (глубже под основную).
# Setting type: Single
# Default value: 0
PillOffsetX = 0

## Сдвиг левой панели по Y (в единицах интерфейса), положительное = выше.
# Setting type: Single
# Default value: 0
PillOffsetY = 0

## Размер текста относительно автоподбора по высоте панели (1 = максимум, что влезает).
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0,3 to 1,5
TextFit = 1

## Жирный шрифт надписи.
# Setting type: Boolean
# Default value: true
PillBold = true

[Crosshair]

## Динамический прицел: рамка раздвигается тем сильнее, чем дальше курсор от игрока.
# Setting type: Boolean
# Default value: true
DynamicCrosshair = true

## Расстояние от игрока до курсора (в игровых единицах), на котором рамка раздвинута максимально.
# Setting type: Single
# Default value: 50
# Acceptable value range: From 1 to 300
DynamicRangeFar = 50

## Максимальное раздвигание рамки (доля размера прицела).
# Setting type: Single
# Default value: 0.7
# Acceptable value range: From 0 to 2
DynamicMaxSpreadStrong = 0.7

## Прятать обычный курсор, пока показана рамка прицела (над интерфейсом курсор остаётся).
# Setting type: Boolean
# Default value: true
HideSystemCursor = true

[General]

## Продолжать наводить оружие на курсор, когда персонаж долго стоит на месте и садится/ложится.
# Setting type: Boolean
# Default value: true
AimWhileIdle = true

## Поворачивать персонажа лицом к курсору, пока оружие в ведущей руке.
# Setting type: Boolean
# Default value: true
FaceCursor = true

## Наводить оружие на курсор без сглаживания (учитывая положение дула).
# Setting type: Boolean
# Default value: true
PreciseArm = true

## ЧИТ: в момент выстрела направлять пулю точно в курсор, даже если оружие ещё не довелось. По умолчанию выключено: пуля летит туда, куда реально смотрит оружие (там же стоит точка прицела).
# Setting type: Boolean
# Default value: false
SnapShotsToCursor = false

[Tuning]

## Если курсор ближе этого расстояния (в юнитах) к торсу, оружие целится вперёд по взгляду персонажа, а не закидывается за спину. 0 = выключить.
# Setting type: Single
# Default value: 1.3
# Acceptable value range: From 0 to 4
NearBodyRadius = 1.3

## Если курсор ближе этого расстояния (в юнитах) к дулу, точная наводка отключается и работает обычная игровая. Убирает дёрганье, когда курсор рядом с персонажем.
# Setting type: Single
# Default value: 2
# Acceptable value range: From 0,5 to 6
MinAimDistance = 2

## Как быстро рука доводит оружие до курсора (1/с). Больше = быстрее, около 3 - тяжёлая медленная наводка, около 20 - почти мгновенно.
# Setting type: Single
# Default value: 9
# Acceptable value range: From 0,5 to 40
AimSpeed = 9

## Предел скорости поворота оружия при наводке (градусов в секунду).
# Setting type: Single
# Default value: 540
# Acceptable value range: From 30 to 3000
AimMaxSpeed = 540

## Мёртвая зона (в юнитах) по X, чтобы персонаж не дёргался, когда курсор прямо над ним.
# Setting type: Single
# Default value: 0.15
# Acceptable value range: From 0 to 2
FaceDeadzone = 0.15

## Сколько секунд после выстрела не доводить руку, чтобы была видна отдача (0 = без отдачи).
# Setting type: Single
# Default value: 0.1
# Acceptable value range: From 0 to 2
RecoilPause = 0.1

[Weapons]

## Задержка (в секундах) между нажатием клавиши магазина и самим действием: снятие/вставка магазина или патрона.
# Setting type: Single
# Default value: 0.3
# Acceptable value range: From 0 to 3
MagActionDelay = 0.3

