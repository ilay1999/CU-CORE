[Controls]

## The universal key used to activate species abilities. Examples: G, B, N, Tab, Space, Semicolon, LeftBracket, etc.
# Setting type: String
# Default value: LeftAlt
Ability Keybind = Mouse4

## Key used to grab objects with Mercenary's Levitation chip.
# Setting type: String
# Default value: Mouse2
Mercenary Levitation Keybind = Mouse2

## Key used to Reform during Mercenary's death sequence.
# Setting type: String
# Default value: G
Mercenary Reformation Keybind = G

## Key used to switch to the next sprite slot.
# Setting type: String
# Default value: RightBracket
Sprite Slot Up Keybind = RightBracket

## Key used to switch to the previous sprite slot.
# Setting type: String
# Default value: LeftBracket
Sprite Slot Down Keybind = LeftBracket

## Key used to cycle backward one hand slot (Orange only).
# Setting type: String
# Default value: E
Orange Hand Step Back Keybind = E

[SaveData]

## Stores the species of the current run.
# Setting type: String
# Default value: 
ActiveSpecies = Leapy

## Mercenary's currently worn host species.
# Setting type: String
# Default value: Mercenary
MercenaryHostSpecies = Mercenary

## Mercenary's accumulated Hollow level.
# Setting type: Int32
# Default value: 0
MercenaryHollowLevel = 0

## Number of Baron's horns broken this run.
# Setting type: Int32
# Default value: 0
BaronHornsBroken = 0

## Whether Albino's current run started with the eye-loss scar.
# Setting type: Boolean
# Default value: true
AlbinoEyeScar = true

[Settings]

## If true, hides the settings search bar entirely.
# Setting type: Boolean
# Default value: false
DisableSettingsSearch = false

## Language file to use (e.g., 'en' for English, 'ru' for Russian). Do not include the .json extension.
# Setting type: String
# Default value: en
Language = ru

## Enable per-species WoundView color theming.
# Setting type: Boolean
# Default value: true
WoundViewRecolor = true

## Enable animated colors/motion for {Keyword} status text. If disabled, tagged words are underlined instead.
# Setting type: Boolean
# Default value: true
TextEffects = true

## If true, disables all per-species XP rate modifiers entirely (everyone gains XP at the normal 1x rate).
# Setting type: Boolean
# Default value: false
DisableExperienceModifiers = false

## Show Velvet tendril limbs in WoundView.
# Setting type: Boolean
# Default value: false
TendrilMode = false

## If true, hides species tail sprites in WoundView.
# Setting type: Boolean
# Default value: false
DisableTailSprites = false

## If true, shows a colored diet-compatibility tag in the extended item tooltip.
# Setting type: Boolean
# Default value: false
DietTooltipsEnabled = false

## If true, shows which hand (Main/Secondary/Tertiary/Quaternary) is holding each item in the currently-held-item display.
# Setting type: Boolean
# Default value: false
OrangeShowHandLabels = false

## If true, disables all species dietary restrictions and their penalties.
# Setting type: Boolean
# Default value: false
DisableDietRestrictions = false

## If true, shows a progress bar while reading long notes and E-PDAs.
# Setting type: Boolean
# Default value: true
ShowReadingProgress = true

## If true, new Albino characters use the original start (guaranteed one-eye loss and a random splinted leg fracture) instead of random starting wounds.
# Setting type: Boolean
# Default value: false
AlbinoClassicStart = false

## If true, skips the update-available popup on launch.
# Setting type: Boolean
# Default value: false
DisableUpdateNotifications = false

