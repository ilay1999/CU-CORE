## If true, the affliction panel shows a synthetic test row for UI development.
# Setting type: Boolean
# Default value: false
ShowDebugTestRow = false

## When true, active mod afflictions also appear as status icons in the vanilla bottom moodle bar (with hover tooltips), alongside the game's own status icons.
# Setting type: Boolean
# Default value: true
ShowModMoodles = true

## When true, high hallucination/psychosis severity renders phantom horrors on the local player's own screen: phantom spiders, phantom bleeding, whispers, and (psychosis>30) Barotrauma-style audio flashbacks — gunshots, sonar/Vietnam jolts, pain SFX, vanilla screams. Purely cosmetic and client-side.
# Setting type: Boolean
# Default value: true
HallucinationVisuals = true

[Items]

## When true, our custom medical items (nt_o2_condenser, nt_scalpel, surgical tools, etc.) are inserted into ItemLootPool.pool["medical"] so they can spawn at traders and in loot crates. Set to false if you only want to acquire them via console commands or crafting.
# Setting type: Boolean
# Default value: true
AddToLootPool = true

[Multiplayer]

## When true, the host arbitrates all affliction changes. Clients only render and request treatments.
# Setting type: Boolean
# Default value: true
HostAuthoritative = true

## Seconds between periodic full-state broadcasts. Immediate deltas are still sent on significant changes.
# Setting type: Single
# Default value: 1
SyncIntervalSec = 1

## When true, teammates see each other's afflictions and can treat them. When false, only local.
# Setting type: Boolean
# Default value: true
BroadcastAllPlayers = true

[Recovery]

## Consciousness rise per second while below 50 and painShock is not pinning the patient down.
# Setting type: Single
# Default value: 45
ConsciousnessRecoveryRate = 45

## Multiplier on the coma affliction's natural fade rate. 2 = wake roughly twice as fast.
# Setting type: Single
# Default value: 2
ComaFadeMultiplier = 2

## How much wounds slow movement (0 = off, 1 = default, 1.5 = harsher limp). Uses Body.temporarySlowdown.
# Setting type: Single
# Default value: 1
WoundMovementPenalty = 1

