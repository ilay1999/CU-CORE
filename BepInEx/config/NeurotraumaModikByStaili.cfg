## Kidney damage / failure moodles and progression.
# Setting type: Boolean
# Default value: true
EnableKidney = true

## Lung damage, pneumothorax, hyperventilation and related lung moodles.
# Setting type: Boolean
# Default value: true
EnableLungs = true

## Persistent heartdamage accumulation (transplant path).
# Setting type: Boolean
# Default value: true
EnableHeart = true

## Hallucinations and psychosis moodles (visual FX still use HallucinationVisuals).
# Setting type: Boolean
# Default value: true
EnableSanity = true

## Frostbite per-limb accumulation and moodles.
# Setting type: Boolean
# Default value: true
EnableFrostbite = true

## Tetanus and necrosis progression / moodles.
# Setting type: Boolean
# Default value: true
EnableInfection = true

## Parasites burrowing into untreated foreign-body wounds (parazite) and extract minigame.
