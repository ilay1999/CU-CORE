## Settings file was created by plugin NeurotraumaModik by Staili v2.3.2
## Plugin GUID: NeurotraumaModikByStaili

[Cardiac]

## Multiplier applied to CPR effectiveness while an nt_o2_condenser is in inventory.
# Setting type: Single
# Default value: 1.3
CPRHealBonus = 1.3

[Damage]

## Scales severity of the extra afflictions applied by mine hits (pneumothorax).
# Setting type: Single
# Default value: 1
ExplosionMultiplier = 1

## 0..1 chance to apply pneumothorax within any explosion blast radius (mines, grenades, barrels).
# Setting type: Single
# Default value: 0.4
PneumothoraxChanceOnExplosion = 0.4

[Debug]

## Log every affliction add/tick/remove to BepInEx\LogOutput.log. Noisy — leave off unless debugging.
# Setting type: Boolean
# Default value: false
VerboseLogging = true

[General]

## Master switch. When false, no afflictions are applied, no damage hooks fire, no UI is drawn.
# Setting type: Boolean
# Default value: true
Enabled = true

## Show the affliction panel on the right-bottom of the HUD.
# Setting type: Boolean
# Default value: true
ShowPanel = true

## When true, the panel is drawn even if there are zero mod-side afflictions. When false (default), the panel stays hidden until at least one symptom is active. With DockToWoundView the panel still only appears while the heal screen is open.
# Setting type: Boolean
# Default value: true
AlwaysShowPanel = true

## Legacy toggle (kept for settings UI). The symptoms panel now ALWAYS appears only while the UNI-HEALTH heal screen is open and docks under the left heal column.
# Setting type: Boolean
# Default value: true
DockToWoundView = true

## Extra vertical nudge (pixels) applied to the docked panel. Positive = lower. Use it to fine-tune the gap below the vanilla left column if the auto-detected bottom edge doesn't line up in your resolution / UI scale.
# Setting type: Single
# Default value: 0
DockOffsetY = 400

## Scale multiplier for the affliction panel. 0.75..1.5 recommended.
# Setting type: Single
# Default value: 1
PanelScale = 0.9474771

## Panel background opacity, 0.0..1.0.
# Setting type: Single
# Default value: 0.92
PanelOpacity = 0.92

## Right-side padding of the affliction panel, in pixels (negative moves it left from the edge).
# Setting type: Single
# Default value: -16
PanelOffsetX = 299.7743

## Height above the bottom of the screen where the panel starts, in pixels. Increase if it overlaps the vanilla heal bar.
# Setting type: Single
# Default value: 180
PanelOffsetY = 694.7249

