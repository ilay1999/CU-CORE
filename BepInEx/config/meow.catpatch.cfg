## Settings file was created by plugin CatPatch v1.0.4
## Plugin GUID: meow.catpatch

[Client Settings]

## Show CatPatch sprays placed by players.
# Setting type: Boolean
# Default value: false
ShowSprays = true

## Raw URL for the CatPatch update manifest.
# Setting type: String
# Default value: https://raw.githubusercontent.com/SprightlyHawk8/CatPatch-Releases/main/manifest.json
UpdateManifestUrl = https://raw.githubusercontent.com/SprightlyHawk8/CatPatch-Releases/main/manifest.json

[Server Settings]

## Cooldown in seconds before a player can place another spray.
# Setting type: Single
# Default value: 20
SprayCooldownSeconds = 20

## Allow nearby sleeping players to form a dogpile and improve sleep quality for later sleepers.
# Setting type: Boolean
# Default value: true
DogpileEnabled = true

## Distance in world units used to group nearby sleeping players into a dogpile. CatPatch currently hardcodes this to 1.00.
# Setting type: Single
# Default value: 1
DogpileRadius = 1

## Allow carriers to press the multiplayer shove key to throw the player on their back.
# Setting type: Boolean
# Default value: false
PiggybackThrowEnabled = false

## Velocity applied to a piggybacked player when thrown by their carrier.
# Setting type: Single
# Default value: 28
PiggybackThrowStrength = 28

## Enable CatPatch challenge mode. Host/server spawns extra traps every layer and gives starter kits.
# Setting type: Boolean
# Default value: false
ChallengeModeEnabled = false

## Multiplier for CatPatch challenge mode extra trap density.
# Setting type: Single
# Default value: 1
ChallengeTrapDensity = 1

## Comma-separated item IDs granted once to each player in challenge mode.
# Setting type: String
# Default value: medkit,combatpen,medicalsuture,medicalsuture,medicalsuture,medicalsuture,medicalsuture,medicalsuture,medicalsuture,medicalsuture,medicalsuture,medicalsuture,tourniquet,chestdrain,belt,pistol,headlamp
ChallengeStarterKitItems = medkit,combatpen,medicalsuture,medicalsuture,medicalsuture,medicalsuture,medicalsuture,medicalsuture,medicalsuture,medicalsuture,medicalsuture,medicalsuture,tourniquet,chestdrain,belt,pistol,headlamp

