## Settings file was created by plugin UILagFix v0.2.21
## Plugin GUID: com.local.ui.lagfix

[Craft]

## One inventory scan + one OverlapCircleAll per craft list refresh.
# Setting type: Boolean
# Default value: true
CacheIngredients = true

## Reuse RecipeBox UI rows instead of Destroy/Create on every refresh.
# Setting type: Boolean
# Default value: true
PoolRecipeRows = true

## RecipeBox rows created per frame while the pool is warming. 0 = create all rows in one frame.
# Setting type: Int32
# Default value: 16
PoolWarmBatchSize = 16

## Recipe row UI updates per frame on list refresh. 0 = all rows same frame. Try 12-24 to reduce open hitch.
# Setting type: Int32
# Default value: 16
SpreadRefreshBatch = 16

## Skip GlobalDark.HandleTooltip raycasts while the craft panel is open.
# Setting type: Boolean
# Default value: true
SkipGlobalDarkTooltipsWhileCraftOpen = true

## Only bind viewport + overdraw RecipeBox rows; scroll rebinding updates visible window.
# Setting type: Boolean
# Default value: true
VirtualRecipeRows = true

## Max live recipe rows when VirtualRecipeRows is enabled.
# Setting type: Int32
# Default value: 18
VirtualRowCount = 18

## Extra rows above/below viewport for smooth scroll rebinding.
# Setting type: Int32
# Default value: 2
VirtualRowOverdraw = 2

## Keep the craft panel hierarchy active after prewarm so pressing C avoids SetActive spikes.
# Setting type: Boolean
# Default value: true
HotCraftPanel = true

## Build the full RecipeBox pool in the background after spawn so the first C press is instant.
# Setting type: Boolean
# Default value: true
PrewarmCraftUi = true

## When QoL Unknown is loaded, refresh the recipe list immediately instead of waiting one frame.
# Setting type: Boolean
# Default value: true
QoLImmediateRefresh = true

## Milliseconds to wait after typing before rebuilding the recipe list. 0 = vanilla (every keystroke).
# Setting type: Int32
# Default value: 250
DebounceFilterMs = 250

[Debug]

## Log craft/pause open-close transitions to BepInEx LogOutput (for diagnosing stuck menus).
# Setting type: Boolean
# Default value: false
MenuLog = false

## Also log every intercepted SetActive and periodic hot-panel health checks.
# Setting type: Boolean
# Default value: false
MenuLogVerbose = false

[General]

## Master switch for UILagFix.
# Setting type: Boolean
# Default value: true
Enabled = true

[Pause]

## Keep the pause menu hierarchy active; ESC toggles CanvasGroup visibility instead of SetActive.
# Setting type: Boolean
# Default value: true
HotPausePanel = true

## Activate the pause menu once after spawn (hidden) so the first ESC avoids cold SetActive.
# Setting type: Boolean
# Default value: true
PrewarmPauseUi = true

[Raycast]

## Cache EventSystem.RaycastAll per frame when the mouse position is unchanged.
# Setting type: Boolean
# Default value: true
CacheEnabled = true

