## reuse steam receive byte arrays and one netdatareader. nested receives fall back to new byte[]
# Setting type: Boolean
# Default value: true
ReceivePooling = true

## reuse the pinned send staging buffer. a nested send falls back to stock
# Setting type: Boolean
# Default value: true
SendPooling = true

## reuse decompress streams and a few result buffers. extra results in one frame are new byte[]
# Setting type: Boolean
# Default value: true
