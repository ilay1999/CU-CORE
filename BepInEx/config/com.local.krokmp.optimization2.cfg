## Settings file was created by plugin KrokMPOptimization2 v2.2.52
## Plugin GUID: com.local.krokmp.optimization2

[CatPatch]

## skip idle CatPatch dogpile/piggy Update and hidden host menu OnGUI only (never skips hug/kiss/emote/spray/updater)
# Setting type: Boolean
# Default value: true
SkipIdleControllers = true

[ClientRelief]

## client-side transport/sync relief (msg budget, lazy id dicts, local fps scale). ok on host too
# Setting type: Boolean
# Default value: true
Enabled = true

## max steam packets processed per frame on clients
# Setting type: Int32
# Default value: 256
MaxMessagesPerFrame = 256

## reused ReceiveMessages buffer on clients (stock allocates 65535 entries every frame)
# Setting type: Int32
# Default value: 512
PollBufferSize = 512

## skip rebuilding steamid maps when player count unchanged
# Setting type: Boolean
# Default value: true
LazyIdDicts = true

## scale client sync timers by local fps, not just host fps
# Setting type: Boolean
# Default value: true
LocalFpsScaleEnabled = true

## target frame ms for local fps scale (33 ≈ 30 fps)
# Setting type: Single
# Default value: 33
LocalFpsTargetMs = 33

## minimum AdaptiveSync scale when client frame time is high
# Setting type: Single
# Default value: 0.05
LocalFpsMinScale = 0.05

## skip some netobjectregistry client polls when local fps scale is low
# Setting type: Boolean
# Default value: true
RegistryThrottleEnabled = true

## below this local scale, registry fast polls run every other frame
# Setting type: Single
# Default value: 0.35
RegistryThrottleScaleThreshold = 0.35

## reuse the client registry gather set and overlap buffer. a third overlapping gather falls back to stock
# Setting type: Boolean
# Default value: true
GatherScratch = true

[CraftSync]

## host recipe manifest + client craft index remap when both sides run KrokMPOptimization2
# Setting type: Boolean
# Default value: true
Enabled = true

[Drain]

## max snapshot clears per client ack (0 = off)
# Setting type: Int32
# Default value: 8
AckDrainMaxPerReceive = 8

[ElderHiFi]

## high-frequency authoritative sideband sync for Elder Thornback (only to modded clients; falls back to object sync)
# Setting type: Boolean
# Default value: true
Enabled = true

## send rate for elder snapshots (Hz)
# Setting type: Int32
# Default value: 25
RateHz = 25

## only hi-fi when player within this distance
# Setting type: Single
# Default value: 80
Radius = 80

[GC]

## unity incremental gc slice in ms (runtime only)
# Setting type: Single
# Default value: 1.5
GcSliceMs = 1.5

## forced full GC collect mid layer-transition (armed at flush, fired after delay)
# Setting type: Boolean
# Default value: true
FullCollectOnTransition = true

## seconds after layer flush before the forced full collect fires
# Setting type: Single
# Default value: 10
FullCollectDelaySeconds = 10

[General]

## master switch for host-only SyncProducer and queue patches
# Setting type: Boolean
# Default value: true
Enabled = true

[Item]

## skip stock Item.Update chunk/rb/HandleDecay for owned Items; tick decay/battery at InventoryDecayIntervalSeconds. zero-condition still uses stock Update. see ItemDecayAllItems / stagger / 2x2 / rb skip
# Setting type: Boolean
# Default value: true
InventoryDecayBatch = true

## seconds between batched ApplyDecay ticks (CPUOpt world ItemChunkSim uses 0.05). stagger delays ApplyDecay further across buckets
# Setting type: Single
# Default value: 0.05
InventoryDecayIntervalSeconds = 0.05

## with InventoryDecayBatch: batch all Items (Body, surface parented, world-loose when CPUOpt ChunkSim isnt active). false = Body-held only (2.2.36)
# Setting type: Boolean
# Default value: true
ItemDecayAllItems = true

## round-robin ApplyDecay across N buckets by instance id (frameCount % N). 1 = every owned Item may ApplyDecay same frame when its interval elapses. accumulation still runs every frame
# Setting type: Int32
# Default value: 4
ItemDecayStaggerBuckets = 4

## skip Item.Update when the Item chunk is outside every living player's CPUOpt-style 2x2. Body-held always near. delayed/far decay is fine
# Setting type: Boolean
# Default value: true
ItemDecayNearPlayer2x2 = true

## unparented Items we own: only write rb.simulated / LiquidAffect.enabled when the value would change (stock writes every frame)
# Setting type: Boolean
# Default value: true
ItemSkipUnchangedRb = true

## cache IsHeldUnderBody by immediate parent so stagger-miss frames skip the parent GetComponent walk (invalidate on reparent). default on
# Setting type: Boolean
# Default value: true
ItemDecayCacheHeldUnderBody = true

## Body-held skip 2x2 near-test (always near) and use cached held; also enables held cache. default on. stagger/interval/all-items/2x2 far gate unchanged for non-Body
# Setting type: Boolean
# Default value: true
ItemDecayCheapPrefix = true

[Memory]

## keep one RectOffset per border and skip the idle MP skin rebuild. the skin still rebuilds while a menu or the player list is open
# Setting type: Boolean
# Default value: true
CacheImguiStyles = true

## skip krokmp imgui skin rebuild when scale/resolution unchanged
# Setting type: Boolean
# Default value: true
SkipIdleSkinRebuild = true

## drop the second in-world uiingame pass each ongui
# Setting type: Boolean
# Default value: true
DeduplicateInGameUi = true

## reuse gzip/deflate scratch streams. still calls compresswriter so receivers can decompressreader
# Setting type: Boolean
# Default value: true
CompressPooling = true

## replace consciousnesstext += "!" with a fixed string
# Setting type: Boolean
# Default value: true
FixUnconsciousText = true

## remove orphan coolsync objstates on cull / layer flush / transport end
# Setting type: Boolean
# Default value: true
PruneCoolSyncObjStates = true

## destroy unused steam avatar texture2ds on leave / transport end
# Setting type: Boolean
# Default value: true
PruneSteamAvatars = true

## reuse coolsync object lists, skip linq tolist/elementat/any, pool snapshots and bitset buffers
