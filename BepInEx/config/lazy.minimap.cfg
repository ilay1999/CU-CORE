## Settings file was created by plugin Lazy Minimap v1.15.0
## Plugin GUID: lazy.minimap

[Controls]

## Shows or hides the minimap.
# Setting type: KeyboardShortcut
# Default value: M
Toggle minimap = M

## Makes the minimap frame smaller.
# Setting type: KeyboardShortcut
# Default value: LeftBracket
Shrink minimap = LeftBracket

## Makes the minimap frame larger.
# Setting type: KeyboardShortcut
# Default value: RightBracket
Grow minimap = RightBracket

## Cycles square, portrait, and landscape layouts.
# Setting type: KeyboardShortcut
# Default value: P
Cycle minimap shape = P

## Opens or closes the Lazy Minimap settings panel.
# Setting type: KeyboardShortcut
# Default value: F8
Open minimap settings = F8

## Temporarily expands the map while held.
# Setting type: KeyboardShortcut
# Default value: Tab
Hold expanded map = Tab

## Opens or closes the compact discovery journal.
# Setting type: KeyboardShortcut
# Default value: J
Toggle map journal = J

[Discovery]

## Only reveals terrain the local player has actually seen and hides hostiles outside explored space.
# Setting type: Boolean
# Default value: true
Exploration mode = true

## Stores and restores mapped terrain alongside compatible game saves.
# Setting type: Boolean
# Default value: true
Persistent cartography = true

## Pins visible crates, containers, survivors, and traps after they are genuinely seen on screen.
# Setting type: Boolean
# Default value: true
Automatic sight markers = true

## Uses synchronized teammate positions to share travelled terrain and breadcrumb trails.
# Setting type: Boolean
# Default value: true
Shared team cartography = true

## Adds pixel tracing and impact bursts when terrain, pings, and noteworthy objects are discovered.
# Setting type: Boolean
# Default value: true
Discovery flourishes = true

## Leaves fading trails behind players for a short time.
# Setting type: Boolean
# Default value: true
Breadcrumb trails = true

## Adds subtle up or down chevrons to markers far above or below you.
# Setting type: Boolean
# Default value: true
Vertical direction cues = true

[Display]

## Shows the minimap automatically after each round scan.
# Setting type: Boolean
# Default value: true
Visible at round start = true

## Length of the minimap's short side in screen pixels.
# Setting type: Int32
# Default value: 240
Map size = 200

## Distance from the top-right corner in screen pixels.
# Setting type: Int32
# Default value: 18
Screen margin = 18

## Square, portrait, or landscape minimap frame.
# Setting type: MapLayout
# Default value: Landscape
# Acceptable values: Square, Portrait, Landscape
Map shape = Landscape

## Transparency of the minimap, from 0.10 (nearly invisible) to 1.00 (opaque).
# Setting type: Single
# Default value: 0.5
Map opacity = 0.25

[Effects]

## Lets acknowledged targets briefly stand out.
# Setting type: Boolean
# Default value: true
World ping outlines = true

## Lets significant threats influence the map display.
# Setting type: Boolean
# Default value: true
Elder minimap reaction = true

## Lets immediate danger receive extra emphasis.
# Setting type: Boolean
# Default value: true
Elder world outline = true

## Lets the interface adapt to the current layer.
# Setting type: Boolean
# Default value: true
Biome frame styling = true

## Lets environmental instability affect the display.
# Setting type: Boolean
# Default value: true
Seismic map reaction = true

## Lets physical stress interfere with the map signal.
# Setting type: Boolean
# Default value: true
Condition map reaction = true

## Controls how strongly physical stress and sudden danger affect the field map.
# Setting type: ReactiveIntensity
# Default value: Reactive
# Acceptable values: Subtle, Reactive, Chaotic
Reactive intensity = Reactive

## Allows subtle impressions of nearby activity.
# Setting type: Boolean
# Default value: true
Sensory threat echoes = true

## Animates the field map when it opens, closes, or changes display mode.
# Setting type: Boolean
# Default value: true
Interface transitions = true

[Internal]

## Used to apply one-time default migrations between Lazy Minimap releases.
# Setting type: Int32
# Default value: 0
Configuration revision = 2

