## Settings file was created by plugin CU Gun Helper v0.5.0
## Plugin GUID: com.tigerlin.cu.gunhelper

[Behavior]

## true = 战术换弹（丢弃旧弹匣）；false = 普通换弹（旧弹匣放回容器）
# Setting type: Boolean
# Default value: false
UseTacticalReload = true

## true = 霰弹枪每开一枪自动泵动重新上膛；false = 关闭自动泵动。
# Setting type: Boolean
# Default value: true
AutoPumpShotgun = true

## 退弹匣耗时（秒）。设为 0 则瞬间卸下。
# Setting type: Single
# Default value: 0.45
UnloadMagTime = 0.45

## 取新弹药耗时（秒）：弹药拿在手上、直接插在身上，或装在可穿戴装备（腿包、战术胸挂等，不占物品栏）里时用这个值。设为 0 则瞬间拿到。
# Setting type: Single
# Default value: 0.55
FetchMagTime = 0.55

## 取新弹药耗时（秒）：弹药装在占物品栏的纯容器里、需要翻包取出时用这个值。比随身取慢。设为 0 则瞬间拿到。
# Setting type: Single
# Default value: 1.6
FetchContainerTime = 1.6

## 装弹匣耗时（秒）。设为 0 则瞬间装上。
# Setting type: Single
# Default value: 0.5
LoadMagTime = 0.5

## 霰弹枪每塞一颗散装壳的耗时（秒）。与装弹匣耗时分开计算。
# Setting type: Single
# Default value: 1
LoadShellTime = 1

## 上膛耗时（秒）。设为 0 则瞬间上膛。
# Setting type: Single
# Default value: 0.8
RackTime = 0.8

## 霰弹枪泵动-拉（向后拉枪机）的基础耗时（秒），即智力/力量等于 PumpSkillRefLevel（默认 10）时的值。属性更高时会按下方 PumpSkill 各项递减。
# Setting type: Single
# Default value: 0.5
PumpPullTime = 0.5

## 霰弹枪泵动-推（推回并推弹进膛）的基础耗时（秒），即智力/力量等于 PumpSkillRefLevel（默认 10）时的值。属性更高时会按下方 PumpSkill 各项递减。
# Setting type: Single
# Default value: 0.5
PumpPushTime = 0.5

## 手持弹匣按换弹键压弹时，每压一发子弹的基础耗时（秒）。这是属性基准等级（SkillReloadRefLevel，默认 12）下的值；实际耗时 = 该值 × 与换弹同一套属性倍率，所以 10 智力时约 1.65 秒/发。
# Setting type: Single
# Default value: 1.5
LoadRoundTime = 1.5

## 【建议不要修改】选弹匣：快档（身上/可穿戴装备）里的弹匣，发数达到「候选里最大的弹匣容量」的这个百分比时，优先拿它——省掉翻包的取弹时间。默认 80。
# Setting type: Single
# Default value: 80
MagPickHighPercent = 80

## 【建议不要修改】选弹匣：一个满匣都没有时，快档的弹匣比场上最满的少不到这个百分比（按两者中较小的那个容量算），就拿快档的，否则翻包。默认 20。
# Setting type: Single
# Default value: 20
MagPickClosePercent = 20

[General]

## 界面语言：0 = English（英文，默认），1 = 中文。
# Setting type: Int32
# Default value: 0
Language = 0

[HUD]

## 枪内子弹显示模式：0=精确显示数字，1=大致显示(满/几乎全满/大于一半/还剩一半/少于一半/几乎空了/空，霰弹枪仍显示数字)，2=不显示。
# Setting type: Int32
# Default value: 0
AmmoDisplayMode = 0

## 弹药HUD背景条透明度(0~1)。
# Setting type: Single
# Default value: 0.9
HudBgAlpha = 0.9

## 弹药HUD文字透明度(0~1)。
# Setting type: Single
# Default value: 1
HudTextAlpha = 1

## 弹药HUD距屏幕底边的距离(像素)。
# Setting type: Single
# Default value: 60
HudOffsetY = 60

## 弹药HUD距屏幕左边的距离(占渲染宽度百分比,0~100)。
# Setting type: Single
# Default value: 84.5
HudOffsetXPercent = 84.5

## 弹药HUD字号(像素)。
# Setting type: Single
# Default value: 20
HudFontSize = 20

## true = HUD 显示身上备用弹匣数量；false = 隐藏。
# Setting type: Boolean
# Default value: true
ShowSpareMag = true

## true = HUD 显示身上备弹量；false = 隐藏。
# Setting type: Boolean
# Default value: true
ShowReserveAmmo = true

## true = HUD 术语跟随角色认知（不认识弹匣/弹药时用模糊说法，认识后用游戏内的物品名）；false = 一直用固定术语。
# Setting type: Boolean
# Default value: true
HudRespectRecognition = true

## true = 弹匣低量时枪内那行字变红并提示换弹；false = 关闭。
# Setting type: Boolean
# Default value: true
LowAmmoWarn = true

## 弹匣存量低于此百分比(占容量)时触发低量警告(0~100)。同时用作「可用弹匣」的判定线：弹匣内子弹达到其自身容量的这个百分比才算可用。
# Setting type: Single
# Default value: 25
LowAmmoPercent = 25

## true = 弹匣快空时枪内文字闪烁；false = 仅变红不闪。
# Setting type: Boolean
# Default value: true
LowAmmoBlink = true

## true = 身上没有「可用弹匣」时，在角色下方居中闪烁提醒去压子弹（不占用右下角弹药 HUD）。「可用」的判定 = 弹匣内部子弹 >= LowAmmoPercent 占其自身容量的百分比；false = 关闭该提醒。
# Setting type: Boolean
# Default value: true
NoUsableMagWarn = true

[Keybinds]

## 自动换弹快捷键
# Setting type: KeyboardShortcut
# Default value: G
ReloadKey = G

## 打开/关闭设置面板快捷键
# Setting type: KeyboardShortcut
# Default value: Alpha0
SettingsKey = Alpha0

[Skill]

## 泵动递减的基准等级：智力/力量等于此等级时按基础耗时。低于它不惩罚、也不加成。默认 10。
# Setting type: Single
# Default value: 10
PumpSkillRefLevel = 10

## 泵动递减：智力减到这一级为止。默认 16，即智力 16 时比基准共减 (16-10)×PumpIntPerLevel = 0.15s。智力再高也不会更快，但力量仍可继续往下减。
# Setting type: Single
# Default value: 16
PumpIntCapLevel = 16

## 泵动递减：智力每高于基准 1 级，每个动作（拉、推各算一次）减少的秒数。默认 0.025。
# Setting type: Single
# Default value: 0.025
PumpIntPerLevel = 0.025

## 泵动递减：力量每高于基准 1 级，每个动作（拉、推各算一次）减少的秒数，不封顶。默认 0.01。
# Setting type: Single
# Default value: 0.01
PumpStrPerLevel = 0.01

## true = 换弹耗时随智力(INT)等级缩放，霰弹枪泵动耗时随智力/力量缩放：属性越高越快；false = 全部恒定耗时。
# Setting type: Boolean
# Default value: true
UseSkillReloadSpeed = true

## 基准智力等级。等于此等级时倍率为 1.0（即上面配置的原始秒数）。
# Setting type: Single
# Default value: 12
SkillReloadRefLevel = 12

## 基准等级以上：每高 1 级，耗时减少的比例。0.05 = 每级快 5%。
# Setting type: Single
# Default value: 0.05
SkillReloadPerLevel = 0.05

## 认识弹匣弹药、但还不认识枪时的耗时倍率（对应智力 9）。
# Setting type: Single
# Default value: 1.6
SkillPenaltyNoGun = 1.6

## 连弹匣和弹药都不认识时的耗时倍率（智力 9 以下，纯摸索）。
# Setting type: Single
# Default value: 3
SkillPenaltyNoAmmo = 3

## 耗时倍率下限（智力越高越接近此值，越小越快）。
# Setting type: Single
# Default value: 0.6
SkillReloadMinMult = 0.6

## 耗时倍率上限（智力越低越接近此值，越大越慢）。
# Setting type: Single
# Default value: 3
SkillReloadMaxMult = 3

